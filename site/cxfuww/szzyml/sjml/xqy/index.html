        .flip-card-container {
            perspective: 1000px;
            width: 100%;
            min-height: 380px;
            transition: min-height 0.6s ease;
        }

        .flip-card-container.flipped {

        @media only screen and (max-width: 830px) {

        .flip-card {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card.flipped {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 240px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .flip-card-back {
            transform: rotateY(180deg);
            min-height: 400px;
        }

        .flip-card-back .form-group {
            width: 100%;
            margin-bottom: 16px;
        }

        .flip-card-back .form-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            text-align: left;
        }

        .flip-card-back .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .flip-card-back .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
            /* 禁止拖拽调整大小 */
            min-height: 80px;
            max-height: 80px;
            /* 最多展示3行 */
        }

        .flip-card-back .form-group textarea:focus {
            outline: none;
            border-color: #1677ff;
        }

        .flip-card-back .word-count {
            display: block;
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .flip-card-back .form-group input:focus {
            outline: none;
            border-color: #1067E8;
        }

        .flip-card-back #demandForm {
            width: 100%;
        }

        .flip-card-back .form-actions {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            justify-content: center;
        }

        .flip-card-back .btn-submit {
            background: #ff7a25;
            color: #fff;
            border: 1px solid #ff7a25;
            padding: 10px 32px;
            border-radius: 4px;
            cursor: pointer;
        }



        .flip-card-back .btn-back {
            background: #fff;
            color: #666;
            border: 1px solid #d9d9d9;
            padding: 10px 32px;
            border-radius: 4px;
            cursor: pointer;
        }

        .flip-card-back .btn-back:hover {
            border-color: #ff7a25;
            color: #ff7a25;
        }

        .flip-card-back .success-message {
            color: #52c41a;
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }

        .flip-card-back .required {
            color: #ff4d4f;
            margin-left: 4px;
        }

        .flip-card-back .error-message {
            display: none;
            color: #ff4d4f;
            font-size: 12px;
            margin-top: 4px;
            text-align: left;
            width: 100%;
        }

        .flip-card-back .error-message.show {
            display: block;
        }

        .flip-card-back .form-group.error input {
            border-color: #ff4d4f;
        }

    <script type="text/javascript">
        function toggleBodyScroll(enable) {
            document.body.style.overflow = enable ? '' : 'hidden';
        }

        var modalOverlays = document.querySelectorAll('.search-login-modal-overlay');
        modalOverlays.forEach(function (overlay) {
            var observer = new MutationObserver(function (mutations) {
                mutations.forEach(function (mutation) {
                    if (mutation.attributeName === 'class') {
                        var isActive = overlay.classList.contains('is-active');
                        toggleBodyScroll(!isActive);
                    }
                });
            });
            observer.observe(overlay, { attributes: true });
        });

        document.addEventListener('touchmove', function (e) {
            var activeOverlay = document.querySelector('.search-login-modal-overlay.is-active');
            if (activeOverlay) {
                var modal = activeOverlay.querySelector('.search-login-modal');
                if (modal) {
                    var isScrollable = modal.scrollHeight > modal.clientHeight;
                    var canScrollUp = modal.scrollTop > 0;
                    var canScrollDown = modal.scrollTop < (modal.scrollHeight - modal.clientHeight);

                    if (!isScrollable || (!canScrollUp && e.touches[0].clientY > e.changedTouches[0].clientY) || (!canScrollDown && e.touches[0].clientY < e.changedTouches[0].clientY)) {
                        e.preventDefault();
                    }
                } else {
                    e.preventDefault();
                }
            }
        }, { passive: false });
    </script>
