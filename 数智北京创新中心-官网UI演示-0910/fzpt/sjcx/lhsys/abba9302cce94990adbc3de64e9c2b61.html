				<p>

				</p>
			</div>
			<div class="text">
				<p><span style="font-family: 微软雅黑, &quot;Microsoft YaHei&quot;; font-size: 19px;">联合科研院校及相关企业在政务外网环境开展空间图数据研究，在数据资源、技术能力、服务运营等方面进行合作。基于城市副中心155平方公里范围内智慧城市场景示范案例，整合前期征集的场景创新需求，对接移动、百度、京东、滴滴、美团、亦庄智能院等多家代表性企业，围绕空间布局和发展需求，形成整体实数方案，覆盖智能交通、智慧文旅、智慧水务、智慧街区等场景，展示人工智能、边缘计算、数字孪生、元宇宙等智慧城市前言技术的创新实践，实现多样化交互体验，为创新主题提供创新实验基础环境，丰富智慧城市场景创新生态。</span></p>
